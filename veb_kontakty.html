<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Контакты</title>
<style>
body {
  font-family: "Poppins", sans-serif;
  margin: 0;
  background: linear-gradient(135deg, #c3cfe2, #2662bb);
  color: #2d2d2d;
}
header {
  background: linear-gradient(90deg, #7471ce, #494cb0);
  color: #fff;
  padding: 45px 20px;
  text-align: center;
  background-size: 400% 400%;
  animation: headerGradient 8s ease infinite;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeSlideUp 0.8s forwards 0.3s;
}
@keyframes headerGradient {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
nav {
  background-color: #ffffffcc;
  backdrop-filter: blur(8px);
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 10px 0;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeSlideUp 0.8s forwards 0.5s;
}
nav a {
  color: #4338ca;
  padding: 12px 20px;
  text-decoration: none;
  font-weight: 600;
  border-radius: 8px;
  transition: 0.3s;
}
nav a:hover {
  background-color: #ede9fe;
  color: #1e3a8a;
}
main {
  padding: 50px 15%;
  text-align: center;
}
.contact-box {
  background: rgba(255,255,255,0.4);
  backdrop-filter: blur(10px);
  padding: 35px;
  border-radius: 18px;
  margin-top: 30px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.08);
  opacity: 0;
  transform: translateY(30px);
  animation: fadeSlideUp 0.8s forwards;
}
.contact-box:nth-child(2){ animation-delay: 0.6s; }
.contact-box:nth-child(3){ animation-delay: 0.8s; }
.contact-box p {
  margin: 12px 0;
  font-size: 18px;
}
.author-box {
  font-size: 18px;
}
footer {
  background-color: #1e1b4b;
  color: #fff;
  text-align: center;
  padding: 25px;
  margin-top: 60px;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeSlideUp 0.8s forwards 1s;
}
@keyframes fadeSlideUp {
  0% { opacity: 0; transform: translateY(30px); }
  100% { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>
<header>
  <h1>Контакты</h1>
</header>
<nav>
  <a href="veb_main.htm">Главная</a>
  <a href="veb_o_nas.htm" target="_blank">О нас</a>
  <a href="veb_vhod.htm" style="margin-left:auto" target="_blank">Вход</a>
  <a href="veb_registratsiya.htm" target="_blank">Регистрация</a>
</nav>
<main>
  <h2>Свяжись с нами</h2>
  <div class="contact-box">
    <p>Телефон: +7 777 449 17 50</p>
    <p>Email: anelyaberdimuratova@gmail.com</p>
    <p>Адрес: г. Алматы, Назарбаева 120</p>
  </div>
  <h2>Автор</h2>
  <div class="contact-box author-box">
    <p>Бердимуратова Анеля Кайратовна</p>
  </div>
</main>
<footer>
  © 2025 Путь Саморазвития
</footer>
</body>
</html>
