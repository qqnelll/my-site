<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Цели и Планирование</title>
<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    background: linear-gradient(135deg, #2b2e8d, #6a5acd);
    color: #fff;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    text-align: center;
    padding: 40px 20px;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeSlideUp 0.8s forwards 0.3s;
  }
  header h1 {
    font-size: 2.4em;
    margin-bottom: 10px;
  }
  header p {
    font-size: 1.2em;
    opacity: 0.9;
  }
  main {
    width: 100%;
    max-width: 1100px;
    margin: 20px auto;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 40px;
    display: flex;
    flex-direction: column;
    gap: 40px;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
    opacity: 0;
    transform: translateY(20px);
    animation: fadeSlideUp 0.8s forwards 0.5s;
  }
  .goal-section {
    display: grid;
    grid-template-columns: 1fr;
    gap: 40px;
  }
  @media (min-width: 850px) {
    .goal-section {
      grid-template-columns: 1fr 1fr;
    }
  }
  h2 {
    color: #f0eaff;
    border-bottom: 2px solid rgba(255, 255, 255, 0.3);
    padding-bottom: 8px;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 15px;
  }
  input, textarea {
    padding: 12px;
    border: none;
    border-radius: 10px;
    outline: none;
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
  }
  input::placeholder, textarea::placeholder {
    color: #d0cfff;
  }
  button {
    background-color: #7c4dff;
    border: none;
    color: white;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 1em;
    margin-top: 10px;
    transition: 0.3s;
  }
  button:hover {
    background-color: #9575ff;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
    display: grid;
    grid-template-columns: 1fr;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    overflow: hidden;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeSlideUp 0.8s forwards 0.7s;
  }
  thead, tbody, tr {
    display: contents;
  }
  th, td {
    padding: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.2);
  }
  th {
    color: #cfc7ff;
    background: rgba(255,255,255,0.15);
  }
  tr:nth-child(even) td {
    background: rgba(255,255,255,0.05);
  }
  footer {
    text-align: center;
    padding: 20px;
    color: #ddd;
    font-size: 0.9em;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeSlideUp 0.8s forwards 1s;
  }
  a.back {
    display: inline-block;
    color: #c0b5ff;
    text-decoration: none;
    transition: 0.3s;
  }
  a.back:hover {
    color: #fff;
  }
  @keyframes fadeSlideUp {
    0% { opacity: 0; transform: translateY(30px); }
    100% { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<header>
  <h1>Цели и Планирование</h1>
  <p>Определи, чего ты хочешь — и создай свой путь к этому</p>
</header>
<main>
  <a href="veb_smrvt.htm" class="back">← На главную</a>
  <div class="goal-section">
    <div>
      <h2>Добавь свою цель</h2>
      <form id="goalForm">
        <input type="text" id="goal" placeholder="Ваша цель" required>
        <textarea id="steps" rows="3" placeholder="Какие шаги нужно сделать?" required></textarea>
        <input type="date" id="deadline" required>
        <button type="submit">Добавить цель</button>
      </form>
    </div>
    <div>
      <h2>Мои цели</h2>
      <table id="goalTable">
        <thead>
          <tr>
            <th>Цель</th>
            <th>Шаги</th>
            <th>Срок</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</main>
<footer>
  © 2025 Путь Саморазвития | Цели и Планирование
</footer>
<script>
  const form = document.getElementById('goalForm');
  const tableBody = document.querySelector('#goalTable tbody');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const goal = document.getElementById('goal').value;
    const steps = document.getElementById('steps').value;
    const deadline = document.getElementById('deadline').value;
    const newRow = document.createElement('tr');
    newRow.innerHTML = `
      <td>${goal}</td>
      <td>${steps}</td>
      <td>${deadline}</td>
    `;
    tableBody.appendChild(newRow);
    form.reset();
  });
</script>
</body>
</html>
