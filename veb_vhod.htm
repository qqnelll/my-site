<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход | Путь Саморазвития</title>
<style>
  body {
    font-family: "Poppins", sans-serif;
    margin: 0;
    background: linear-gradient(135deg, #c3cfe2, #2662bb);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .login-box {
    background: #fff;
    padding: 40px 50px;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    width: 350px;
    text-align: center;
    opacity: 0;
    transform: translateY(30px);
    animation: fadeSlideUp 0.8s forwards 0.3s;
  }
  h2 {
    color: #4338ca;
    margin-bottom: 25px;
  }
  input {
    width: 100%;
    padding: 12px;
    margin: 10px 0 20px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 1em;
    outline: none;
    transition: 0.3s;
  }
  input:focus {
    border-color: #6366f1;
    box-shadow: 0 0 5px #a5b4fc;
  }
  button {
    background: linear-gradient(90deg, #6d28d9, #2563eb);
    color: #fff;
    border: none;
    padding: 12px 25px;
    border-radius: 25px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
    width: 100%;
  }
  button:hover {
    opacity: 0.9;
    transform: translateY(-2px);
  }
  p {
    margin-top: 20px;
    font-size: 0.9em;
  }
  a {
    color: #4338ca;
    text-decoration: none;
    font-weight: 500;
  }
  a:hover {
    text-decoration: underline;
  }
  @keyframes fadeSlideUp {
    0% { opacity: 0; transform: translateY(30px); }
    100% { opacity: 1; transform: translateY(0); }
  }
</style></head>
<body>
<div class="login-box">
  <h2>Вход</h2>
  <form>
    <input type="email" placeholder="Введите email" required>
    <input type="password" placeholder="Введите пароль" required>
    <button type="submit">Войти</button>
  </form>
  <p>Нет аккаунта? <a href="veb_registratsiya.htm">Зарегистрироваться</a></p>
  <p><a href="veb_smrvt.htm">← Назад на главную</a></p>
</div>
</body>
</html>
